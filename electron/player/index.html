<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <!-- The page loads nothing from anywhere: no remote content, no inline handlers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; media-src aiomedia:; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title>Oynatıcı</title>
    <link rel="stylesheet" href="player.css" />
  </head>
  <body>
    <div id="app" class="idle">
      <header id="bar">
        <span class="tag" id="tag">oynatıcı</span>
        <span id="title"></span>
      </header>

      <div id="stage">
        <video id="video" playsinline crossorigin="anonymous"></video>
        <!-- A second, silent decoder for the scrub-bar preview: seeking it never
             disturbs the one you are watching. -->
        <video id="probe" muted preload="metadata" crossorigin="anonymous" hidden></video>
        <div id="subs" data-size="normal"></div>

        <div id="pulse" aria-hidden="true"></div>
        <div id="spinner" aria-hidden="true"></div>

        <div id="resume" hidden>
          <span id="resume-text"></span>
          <button type="button" id="resume-restart">Baştan başlat</button>
        </div>

        <div id="upnext" hidden>
          <div class="upnext-card">
            <span class="upnext-label" id="upnext-label">Sonraki bölüm</span>
            <strong id="upnext-title"></strong>
            <div class="upnext-actions">
              <button type="button" id="upnext-go" class="primary">Şimdi oynat</button>
              <button type="button" id="upnext-stay">Vazgeç</button>
            </div>
          </div>
        </div>

        <div id="fault" hidden>
          <strong>Bu dosya oynatılamadı</strong>
          <p id="fault-text"></p>
          <div class="fault-actions">
            <button type="button" id="fault-remux">Hızlı dönüştür ve dene</button>
            <button type="button" id="fault-external">Sistem oynatıcısında aç</button>
          </div>
        </div>

        <div id="controls">
          <div id="seek" role="slider" aria-label="Konum" tabindex="0">
            <div id="seek-track">
              <div id="seek-buffer"></div>
              <div id="seek-played"></div>
              <div id="chapters"></div>
              <div id="seek-knob"></div>
            </div>
            <div id="seek-tip" hidden>
              <canvas id="seek-frame" width="192" height="108" hidden></canvas>
              <span id="seek-chapter"></span>
              <span id="seek-time"></span>
            </div>
          </div>

          <div id="row">
            <button type="button" id="prev" class="ico" title="Önceki bölüm (P)" hidden></button>
            <button type="button" id="play" class="ico" title="Oynat / Duraklat (Boşluk)"></button>
            <button type="button" id="back" class="ico" title="10 sn geri (←)"></button>
            <button type="button" id="fwd" class="ico" title="10 sn ileri (→)"></button>

            <div id="volume-wrap">
              <button type="button" id="mute" class="ico" title="Sesi kapat (M)"></button>
              <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Ses" />
            </div>

            <span id="time" class="mono">0:00 / 0:00</span>
            <span id="chapter-name" class="chapter-name"></span>
            <span class="spacer"></span>

            <button type="button" id="rate" class="pill" title="Oynatma hızı (&lt; &gt;)">1×</button>
            <button type="button" id="audio" class="pill" title="Ses dili (A)" hidden>Ses</button>
            <button type="button" id="next" class="ico" title="Sonraki bölüm (N)" hidden></button>
            <button type="button" id="gear" class="ico" title="Ayarlar"></button>
            <button type="button" id="cc" class="ico" title="Altyazı (V açar/kapatır)"></button>
            <button type="button" id="pip" class="ico" title="Küçük pencere"></button>
            <button type="button" id="full" class="ico" title="Tam ekran (F)"></button>
          </div>
        </div>
      </div>

      <div id="audio-menu" class="popover" hidden>
        <div class="panel-label">Ses dili</div>
        <div id="audio-list"></div>
      </div>

      <div id="quick" class="popover" hidden>
        <div class="quick-row">
          <span>Hız</span>
          <div class="chips" id="q-rate"></div>
        </div>
        <div class="quick-row">
          <span>Görüntü</span>
          <div class="chips" id="q-fit">
            <button type="button" data-fit="contain">Sığdır</button>
            <button type="button" data-fit="cover">Doldur</button>
            <button type="button" data-fit="fill">Uzat</button>
          </div>
        </div>
        <div class="quick-row">
          <span>Ses yükseltme</span>
          <div class="chips" id="q-boost">
            <button type="button" data-boost="1">%100</button>
            <button type="button" data-boost="1.5">%150</button>
            <button type="button" data-boost="2">%200</button>
          </div>
        </div>
        <div class="quick-row">
          <span>Altyazı görünümü</span>
          <div class="chips" id="q-style">
            <button type="button" data-style="box">Kutulu</button>
            <button type="button" data-style="outline">Kenarlıklı</button>
          </div>
        </div>
        <label class="quick-toggle" id="q-autonext-row">
          <input type="checkbox" id="q-autonext" />
          <span>Bitince sonraki bölüme geç</span>
        </label>
        <label class="quick-toggle">
          <input type="checkbox" id="q-ontop" />
          <span>Her zaman üstte (T)</span>
        </label>
        <button type="button" id="q-shot" class="quick-action">Ekran görüntüsü al (S)</button>
      </div>

      <aside id="panel" hidden>
        <div class="panel-head">
          <strong>Altyazı</strong>
          <button type="button" id="panel-close" class="ico small" title="Kapat"></button>
        </div>

        <div class="panel-body">
          <section>
            <div class="panel-label">Şu an</div>
            <div id="track-list"></div>
          </section>

          <section>
            <div class="panel-label">OpenSubtitles'tan indir</div>
            <div class="fetch-row">
              <select id="lang" aria-label="Altyazı dili"></select>
              <button type="button" id="fetch" class="primary">Ara</button>
            </div>
            <p id="fetch-note" class="note"></p>
            <div id="hits"></div>
          </section>

          <section id="timing-section">
            <div class="panel-label">Zamanlama</div>
            <div class="delay-row">
              <button type="button" id="delay-down" title="Altyazıyı geciktir (G)">−0,5 sn</button>
              <span id="delay-value" class="mono">0,0 sn</span>
              <button type="button" id="delay-up" title="Altyazıyı öne al (H)">+0,5 sn</button>
            </div>
            <p class="note">Konuşmadan sonra geliyorsa −, önce geliyorsa +.</p>
          </section>

          <section>
            <div class="panel-label">Yazı boyutu</div>
            <div id="size-row" class="size-row">
              <button type="button" data-size="small">Küçük</button>
              <button type="button" data-size="normal">Orta</button>
              <button type="button" data-size="large">Büyük</button>
              <button type="button" data-size="huge">Çok büyük</button>
            </div>
          </section>
        </div>
      </aside>

      <div id="help" hidden>
        <div class="help-card">
          <strong>Kısayollar</strong>
          <ul id="help-list"></ul>
          <button type="button" id="help-close">Kapat</button>
        </div>
      </div>

      <div id="flash" hidden></div>
    </div>

    <script src="player.js"></script>
  </body>
</html>
