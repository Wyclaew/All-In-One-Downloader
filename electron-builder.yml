appId: com.erne.allinonedownloader
productName: All in One Downloader
copyright: © 2026 erne

directories:
  buildResources: build
  output: release

publish:
  provider: github
  owner: Wyclaew
  repo: All-In-One-Downloader
  # Publish outright rather than leaving a draft nobody can download.
  releaseType: release

files:
  - dist/**
  - electron/**
  - package.json

# Optional: drop yt-dlp / ffmpeg binaries into resources/bin/<platform>/ and they
# get shipped with the app. electron/lib/binaries.js looks there first, then PATH.
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'

mac:
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  category: public.app-category.utilities
  darkModeSupport: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Ad-hoc signing keeps local builds runnable without a developer certificate.
  identity: null

dmg:
  artifactName: ${productName}-${version}-${arch}.dmg

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Utility
