appId: com.erne.allinonedownloader
productName: All in One Downloader
copyright: © 2026 erne

directories:
  buildResources: build
  output: release

# Ad-hoc signs the macOS bundle when no Developer ID is configured. Without it the
# app ships with no signature at all and Apple Silicon refuses to launch it.
afterPack: ./build/after-pack.js

publish:
  provider: github
  owner: Wyclaew
  repo: All-In-One-Downloader
  # Publish outright rather than leaving a draft nobody can download.
  releaseType: release

files:
  - dist/**
  - electron/**
  - package.json

# Optional: drop yt-dlp / ffmpeg binaries into resources/bin/<platform>/ and they
# get shipped with the app. electron/lib/binaries.js looks there first, then PATH.
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'

mac:
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  category: public.app-category.utilities
  darkModeSupport: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Developer ID certificate: build/after-pack.js ad-hoc signs instead, which
  # keeps the bundle launchable everywhere. Gatekeeper still asks the user to
  # confirm the first open — only notarisation removes that, see README.
  identity: null

dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
  # An unsigned build always trips Gatekeeper on first open, so the instructions
  # ride along inside the disk image where the user is standing when it happens.
  window:
    width: 560
    height: 400
  contents:
    - x: 150
      y: 176
      type: file
    - x: 410
      y: 176
      type: link
      path: /Applications
    - x: 280
      y: 320
      type: file
      path: dmg-first-run.txt
      name: İLK AÇILIŞ - OKU.txt

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Utility
